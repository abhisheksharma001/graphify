[project]
name = "graphify"
version = "0.1.0"
description = "Open-source Vapi call analytics with plain-English patterns"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
graphify = "graphify.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
