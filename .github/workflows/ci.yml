name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  engine:
    name: engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo test -q
      - run: cargo clippy --all-targets -- -D warnings

  brain:
    name: brain
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: brain/uv.lock
      - run: uv sync
      - run: uv run pytest -q

  ui:
    name: ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      # ui/ does not exist until S-16. Until then every step below is skipped.
      # hashFiles() cannot gate the job itself: it reads the workspace, which is
      # empty before checkout, so a job-level `if` would never turn on.
      - id: check
        working-directory: .
        run: test -f ui/package.json && echo "exists=true" >> "$GITHUB_OUTPUT" || true
      - uses: pnpm/action-setup@v4.2.0
        if: steps.check.outputs.exists == 'true'
      - uses: actions/setup-node@v5
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.exists == 'true'
      - run: pnpm build
        if: steps.check.outputs.exists == 'true'
