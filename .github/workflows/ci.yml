name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  engine:
    name: engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo test -q
      - run: cargo clippy --all-targets -- -D warnings

  brain:
    name: brain
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: brain/uv.lock
      - run: uv sync
      # The generated client is gitignored, so nothing in `src/` may import it — but a
      # syntax error in `baml_src/` would otherwise ship green, because pytest never
      # reads those files.
      - run: uv run baml-cli generate
      - run: uv run pytest -q

  ui:
    name: ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      # There is no package.json at the repo root, so the action has to be told where
      # the one carrying `packageManager` lives.
      - uses: pnpm/action-setup@v4.2.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
