[package]
name = "graphify"
version = "0.1.0"
edition = "2021"
description = "Open-source Vapi call analytics: sync, store, chart, and re-count patterns"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
